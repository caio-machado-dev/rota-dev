# Configuração da API. Cada valor ${VAR:padrao} lê a variável de ambiente VAR
# e, se ela não existir, usa o padrão. Os padrões servem para desenvolvimento local;
# em produção tudo vem do .env (ADR 0008).

spring:
  application:
    name: rota-dev-api

  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/rotadev}
    username: ${DATABASE_USER:rotadev}
    password: ${DATABASE_PASSWORD:rotadev}

  jpa:
    # O schema é responsabilidade do Flyway. O Hibernate só confere se as entidades
    # batem com as tabelas e falha na subida se não baterem. Nunca deixe o Hibernate
    # criar ou alterar tabelas sozinho.
    hibernate:
      ddl-auto: validate
    # Desliga o "Open Session in View": por padrão o Spring mantém a conexão com o banco
    # aberta até a resposta HTTP ser escrita, o que esconde consultas preguiçosas (lazy)
    # disparadas fora do serviço. Desligado, todo acesso ao banco acontece dentro da
    # camada de aplicação, onde a transação é explícita.
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    locations: classpath:db/migration

  # Login com GitHub (ADR 0005). Crie uma OAuth App em github.com/settings/developers com o
  # callback http://localhost:3000/api/login/oauth2/code/github. Os padrões "dev-sem-oauth"
  # só deixam a API subir; o login de verdade precisa das variáveis no .env.
  security:
    oauth2:
      client:
        registration:
          github:
            client-id: ${GITHUB_CLIENT_ID:dev-sem-oauth}
            client-secret: ${GITHUB_CLIENT_SECRET:dev-sem-oauth}
            scope: read:user, user:email
            # {baseUrl} é a origem que o navegador vê (localhost:3000, pelo rewrite do Next).
            redirect-uri: "{baseUrl}/api/login/oauth2/code/{registrationId}"

  mvc:
    # Erros do Spring (validação, JSON inválido, 404) saem no formato ProblemDetail (RFC 9457),
    # o mesmo que os nossos controllers usam.
    problemdetails:
      enabled: true

  servlet:
    multipart:
      # Mesmo limite do caso de uso UploadDocument (10 MB), com folga para os campos do formulário.
      max-file-size: 10MB
      max-request-size: 11MB

  session:
    jdbc:
      # As tabelas da sessão vêm da migração V3; o Spring Session não cria nada sozinho.
      initialize-schema: never

server:
  # Atrás do Next (e do Caddy, em produção), a API lê os cabeçalhos X-Forwarded-* para saber
  # a origem real. Sem isso, o redirect do OAuth apontaria para http://api:8080.
  forward-headers-strategy: framework
  servlet:
    session:
      timeout: 14d
      cookie:
        name: ROTA_SESSION
        http-only: true
        same-site: lax
        # Em produção (HTTPS) fica true pelo .env; em localhost (HTTP) o navegador recusaria o cookie.
        secure: ${SESSION_COOKIE_SECURE:false}

springdoc:
  # Chaves em ordem alfabética: o openapi.json versionado só muda quando o contrato muda.
  writer-with-order-by-keys: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

# Configurações próprias do Rota Dev (ADR 0012: a marca fica num lugar só).
rota:
  # Chave AES-256 (base64, 32 bytes) que cifra os tokens OAuth no banco (ADR 0008).
  # Sem padrão de propósito: a API não sobe sem ela. Gere com: openssl rand -base64 32
  encryption:
    key: ${ROTA_ENCRYPTION_KEY:}
  storage:
    # Pasta dos arquivos enviados (ADR 0008). No Docker, um volume montado em /data/uploads.
    path: ${ROTA_STORAGE_PATH:./data/uploads}
  github:
    # Trocável nos testes e para GitHub Enterprise.
    api-url: https://api.github.com
  brand:
    name: Rota Dev
    slug: rota-dev
